<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Conference Registration Form</title>
    <!--bootstrap 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!--CSS styles-->
    <link rel="stylesheet" type="text/css" href="styles.css">
    <!--Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rouge+Script&family=Special+Elite&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1>Conference Registration Form</h1>
    <br>
    <div class="container">
        <form>
            <div class="mb-3">
                <label for="registrant-name" name="current-name">Registrant's Name: </label>
                <input required id="registrant-name" name="current-name" maxlength="70" type="text">
                <br>
                <br>
            </div>

            <div class="mb-3">
                <label for="registrant-password" name="current-password">Password: </label>
                <input required id="registrant-password" name="current-password" type="password">
                <br>
                <br>
            </div>

            <div class="mb-3">
                <label for="registrant-email" name="current-email">Email</label>
                <input required id="registrant-email" name="current-email" type="email">
                <br>
                <br>
            </div>

            <div>
                <label for="shirt-size"><strong>T-shirt size:</strong> (All attendees receive a free
                    t-shirt.)</label>
                <br>
                <br>
                <select required id="shirt-size" name="shirt_size">
                    <option value="" disabled selected></option>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>
            <br>

            <div>
                <label for="birthday">Date of Birth (Required):</label>
                <input required id="birthday" type="date" name="current-birthday">
            </div>
            <br>

            <div>
                <label name="receive-email">Do you want to receive email from conference sponsors?</label>
                <br>
                <br>
                <label for="email-yes"></label>
                <input required id="email-yes" name="receive-email" type="radio">Yes

                <label for="email-no"></label>
                <input required id="email-no" name="receive-email" type="radio">No
            </div>
            <br>

            <div>
                <p>Choose sessions: (morning and/or afternoon conference sessions)</p>
                <input type="checkbox" id="morning" name="morning-session">
                <label for="morning">The Morning Session</label>

                <input type="checkbox" id="afternoon" name="afternoon-session">
                <label for="afternoon">The Afternoon Session</label>
            </div>
            <br>

            <div>
                <label for="special-requests" name="requests">Special Requests: </label>
                <br>
                <br>
                <textarea id="special-requests" name="requests" rows="7" cols="70"></textarea>
            </div>
            <br>
            <div>
                <button id="submit-btn">Submit Registration</button>
            </div>
        </form>

    </div>

    <script>
        // select elements by ID
        let nameInput = document.querySelector('#registrant-name');
        let passwordInput = document.querySelector('#registrant-password');
        let emailInput = document.querySelector('#registrant-email');
        let shirtSelect = document.querySelector('#shirt-size');
        let birthdayInput = document.querySelector('#birthday');
        let radioYes = document.querySelector('#email-yes');
        let radioNo = document.querySelector('#email-no');
        let morningCheckbox = document.querySelector('#morning');
        let afternoonCheckbox = document.querySelector('#afternoon');
        let requestsTextarea = document.querySelector('#special-requests');

        // find the button element
        let submitButton = document.querySelector('#submit-btn');

        // add an event listener
        submitButton.addEventListener('click', function () {

            // read all data from the form
            let name = nameInput.value;
            let password = passwordInput.value;
            let email = emailInput.value;
            let tShirtSize = shirtSelect.value;
            let dateOfBirth = birthdayInput.value;
            let specialRequests = requestsTextarea.value;

            let receiveEmailUpdates = null;
            if (radioYes.checked) receiveEmailUpdates = true;
            if (radioNo.checked) receiveEmailUpdates = false;

            let sessionsAttended = [];
            if (morningCheckbox.checked) sessionsAttended.push("morning");
            if (afternoonCheckbox.checked) sessionsAttended.push("afternoon");

            // form validation checks
            if (name === "" || password === "" || email === "" || tShirtSize === "" || dateOfBirth === "" || receiveEmailUpdates === null) {
                alert("Please fill out all required fields!");
                return;
            }
            // validate the session selecton
            if (sessionsAttended.length === 0) {
                alert("Please select at least one session!");
                return;
            }

            // create the JavaScript object
            let registrationData = {
                name: name,
                password: password,
                email: email,
                tShirtSize: tShirtSize,
                dateOfBirth: dateOfBirth,
                receiveEmailUpdates: receiveEmailUpdates,
                sessionsAttended: sessionsAttended,
                specialRequests: specialRequests
            };

            // log the object directly to the console
            console.log(registrationData);

        });

    </script>

</body>

</html>
